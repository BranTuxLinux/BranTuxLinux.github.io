name: Desplegar en GitHub Pages

on:
  # Cambios en el codigo del sitio.
  push:
    branches: [main]
  # Cambios en las notas: el vault es otro repositorio y no dispara nada aqui,
  # asi que se revisa cada cuarto de hora. Publicar una nota tarda eso como
  # mucho.
  schedule:
    - cron: "*/15 * * * *"
  # Para no esperar el cuarto de hora: `gh workflow run deploy.yml`.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Codigo del sitio
        uses: actions/checkout@v5

      # El vault es privado. La llave de despliegue es de solo lectura: si
      # este runner se compromete, no puede escribir en las notas.
      - name: Notas del vault
        uses: actions/checkout@v5
        with:
          repository: BranTuxLinux/obsidian-vault
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}
          path: vault

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Traer las notas publicables
        run: pnpm sync:vault
        env:
          VAULT: ${{ github.workspace }}/vault

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - id: desplegar
        uses: actions/deploy-pages@v4
